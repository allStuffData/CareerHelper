{% extends "base.html" %}

{% block content %}

<div class="space-y-6">

    <!-- Hero -->
    <div class="text-center space-y-2">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">
            Tailor your resume for any job
        </h1>
        <p class="text-slate-500 max-w-lg mx-auto">
            Paste a job description. Our AI rewrites your resume to maximize
            keyword matches — then compiles it to a clean, one-page PDF.
        </p>
    </div>

    <!-- JD Card -->
    <div class="bg-blue-50 rounded-xl border border-blue-100 p-6 space-y-4">
        <div class="flex items-center gap-2 text-sm font-medium text-blue-700">
            <span>📄</span> Job Description
        </div>

        <textarea
            id="jd-textarea"
            name="jd"
            rows="10"
            placeholder="Paste the full job description here…"
            class="w-full rounded-lg border border-slate-200 bg-white p-4 text-sm
                   placeholder:text-slate-400 focus:outline-none focus:ring-2
                   focus:ring-blue-500 focus:border-transparent resize-y
                   min-h-[160px]"
        ></textarea>

        <!-- Company & Role -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">
                    Company
                </label>
                <input
                    type="text"
                    name="company"
                    placeholder="e.g. Stripe"
                    class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm
                           placeholder:text-slate-400 focus:outline-none focus:ring-2
                           focus:ring-blue-500 focus:border-transparent"
                >
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">
                    Role
                </label>
                <input
                    type="text"
                    name="role"
                    placeholder="e.g. Technical Program Manager"
                    class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm
                           placeholder:text-slate-400 focus:outline-none focus:ring-2
                           focus:ring-blue-500 focus:border-transparent"
                >
            </div>
        </div>

        <!-- Template selector -->
        <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">
                Template
            </label>
            <select
                name="template"
                class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm
                       focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
                <option value="default">Default — Modern</option>
                <option value="classic" disabled>Classic (coming soon)</option>
                <option value="compact" disabled>Compact (coming soon)</option>
            </select>
        </div>

        <!-- Generate button -->
        <button
            type="submit"
            class="w-full sm:w-auto bg-blue-500 hover:bg-blue-600 text-white font-medium
                   px-6 py-2.5 rounded-lg text-sm transition-colors
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            hx-post="/api/generate"
            hx-include="#jd-textarea, [name='company'], [name='role'], [name='template']"
            hx-target="#result"
            hx-swap="innerHTML"
        >
            Generate Resume
        </button>
    </div>

    <!-- Result area -->
    <div id="result"></div>

</div>

{% endblock %}
