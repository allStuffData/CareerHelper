[pytest]
# Integrated Phase 1 + Phase 2 layout:
#   tests/          -> Phase 2 (FastAPI) tests
#   backend/tests/  -> Phase 1 (service layer) tests
# `backend` is on the path so Phase 2 imports `app.*`; the repo root is on the
# path so Phase 1 tests import `backend.app.services.*`.
pythonpath = . backend
asyncio_mode = auto
