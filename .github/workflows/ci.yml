name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Installs the single declared dependency set so CI cannot drift from
      # backend/pyproject.toml (openai/anthropic/python-dotenv were once
      # missing and only surfaced on a live generation).
      - name: Install dependencies
        run: python -m pip install -e "backend[dev]"
      # The canonical resume is gitignored, so a green run here also proves the
      # suite does not depend on the developer's local private files.
      - name: Run tests
        run: python -m pytest tests backend/tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
