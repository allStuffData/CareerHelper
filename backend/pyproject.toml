[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerhelper-backend"
version = "0.1.0"
description = "FastAPI application layer for the CareerHelper resume tailoring pipeline."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Runtime dependencies of the Phase 1 service layer (imported lazily by
    # app.services.llm, so they are only hit on a live generation).
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Test configuration lives in the repository-root pytest.ini so the combined
# Phase 1 + Phase 2 suite runs from one place.
